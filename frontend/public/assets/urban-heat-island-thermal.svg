<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="40%" stop-color="#0d1527"/>
      <stop offset="100%" stop-color="#160805"/>
    </linearGradient>

    <!-- Thermal Heat Dome Gradient -->
    <radialGradient id="heatDome" cx="50%" cy="60%" r="55%">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.85"/>
      <stop offset="35%" stop-color="#f97316" stop-opacity="0.6"/>
      <stop offset="65%" stop-color="#eab308" stop-opacity="0.3"/>
      <stop offset="85%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Core Hotspot Glow -->
    <radialGradient id="hotspotCore" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="25%" stop-color="#ff2e00" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#b91c1c" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#b91c1c" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Buffer Gradient -->
    <radialGradient id="coolBuffer" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.7"/>
      <stop offset="40%" stop-color="#06b6d4" stop-opacity="0.4"/>
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid Pattern -->
    <pattern id="cyberGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.12"/>
    </pattern>

    <!-- Building Gradients -->
    <linearGradient id="bldgHeat1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#7f1d1d" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bldgHeat2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#9a3412" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="bldgCool" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#022c22" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#065f46" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.95"/>
    </linearGradient>

    <linearGradient id="thermalBarGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="25%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="75%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="blur1"/>
      <feGaussianBlur stdDeviation="28" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur2"/>
        <feMergeNode in="blur1"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>
  <rect width="1200" height="675" fill="url(#cyberGrid)"/>

  <!-- Satellite LST Thermal Infrared Heat Map Background Aura -->
  <circle cx="620" cy="380" r="420" fill="url(#heatDome)" filter="url(#intenseGlow)"/>
  <circle cx="640" cy="390" r="180" fill="url(#hotspotCore)" filter="url(#intenseGlow)"/>

  <!-- Cool Green Vegetation Zones on Outskirts -->
  <circle cx="160" cy="460" r="190" fill="url(#coolBuffer)" filter="url(#glow)"/>
  <circle cx="1060" cy="480" r="210" fill="url(#coolBuffer)" filter="url(#glow)"/>

  <!-- Isometric / Perspective Heat Cityscape Contours -->
  <!-- Topographic Thermal Contour Isolines -->
  <g fill="none" stroke-linecap="round" opacity="0.65">
    <ellipse cx="620" cy="390" rx="380" ry="160" stroke="#f97316" stroke-width="1.5" stroke-dasharray="6,4"/>
    <ellipse cx="630" cy="395" rx="300" ry="125" stroke="#ef4444" stroke-width="2"/>
    <ellipse cx="640" cy="400" rx="210" ry="90" stroke="#ff2e00" stroke-width="2.5"/>
    <ellipse cx="640" cy="400" rx="120" ry="50" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- Arterial Highway Heat Corridor -->
  <path d="M 0 580 Q 300 560, 600 510 T 1200 480" fill="none" stroke="#f97316" stroke-width="24" stroke-opacity="0.25" filter="url(#glow)"/>
  <path d="M 0 580 Q 300 560, 600 510 T 1200 480" fill="none" stroke="#ef4444" stroke-width="8" stroke-opacity="0.7"/>
  <path d="M 0 580 Q 300 560, 600 510 T 1200 480" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="12,12" stroke-opacity="0.9"/>

  <!-- City Skyline Silhouette with Thermal Heat Radiance -->
  <g id="skyline">
    <!-- Background Low Rises -->
    <rect x="240" y="320" width="45" height="180" rx="4" fill="url(#bldgHeat2)"/>
    <rect x="300" y="270" width="55" height="230" rx="4" fill="url(#bldgHeat1)"/>
    <rect x="370" y="220" width="60" height="280" rx="4" fill="url(#bldgHeat1)"/>
    
    <!-- Central Dense Commercial High Rises (Peak Heat Island) -->
    <rect x="445" y="150" width="70" height="350" rx="5" fill="url(#bldgHeat1)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="530" y="110" width="85" height="390" rx="6" fill="url(#bldgHeat1)" stroke="#ff4d4d" stroke-width="2" filter="url(#glow)"/>
    <polygon points="530,110 572,50 615,110" fill="#ff3333" opacity="0.9"/>
    <line x1="572" y1="50" x2="572" y2="20" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
    <circle cx="572" cy="18" r="4" fill="#ff2200" filter="url(#glow)"/>

    <rect x="630" y="130" width="80" height="370" rx="5" fill="url(#bldgHeat1)" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="725" y="190" width="65" height="310" rx="4" fill="url(#bldgHeat2)"/>
    <rect x="805" y="260" width="55" height="240" rx="4" fill="url(#bldgHeat2)"/>
    <rect x="875" y="310" width="50" height="190" rx="4" fill="url(#bldgHeat2)"/>

    <!-- Green Vegetated Cooling Buffer Zones -->
    <rect x="80" y="380" width="70" height="120" rx="6" fill="url(#bldgCool)" stroke="#10b981" stroke-width="1"/>
    <rect x="165" y="350" width="60" height="150" rx="6" fill="url(#bldgCool)" stroke="#10b981" stroke-width="1"/>
    <rect x="940" y="370" width="65" height="130" rx="6" fill="url(#bldgCool)" stroke="#10b981" stroke-width="1"/>
    <rect x="1020" y="390" width="80" height="110" rx="6" fill="url(#bldgCool)" stroke="#10b981" stroke-width="1"/>
  </g>

  <!-- Thermal Windows & Heat Radiation Particles -->
  <g fill="#ffedd5" opacity="0.6">
    <!-- Glowing Windows -->
    <circle cx="470" cy="190" r="2.5"/><circle cx="490" cy="190" r="2.5"/>
    <circle cx="470" cy="220" r="2.5"/><circle cx="490" cy="220" r="2.5"/>
    <circle cx="470" cy="250" r="2.5"/><circle cx="490" cy="250" r="2.5"/>
    <circle cx="560" cy="160" r="3" fill="#fff"/><circle cx="585" cy="160" r="3" fill="#fff"/>
    <circle cx="560" cy="200" r="3" fill="#fff"/><circle cx="585" cy="200" r="3" fill="#fff"/>
    <circle cx="560" cy="240" r="3" fill="#fff"/><circle cx="585" cy="240" r="3" fill="#fff"/>
    <circle cx="660" cy="180" r="2.5"/><circle cx="680" cy="180" r="2.5"/>
    <circle cx="660" cy="220" r="2.5"/><circle cx="680" cy="220" r="2.5"/>
  </g>

  <!-- Rising Thermal Plumes / Convection Arrows -->
  <g stroke="#f97316" stroke-width="2" fill="none" opacity="0.75">
    <path d="M 550 100 Q 540 70, 555 40" stroke-dasharray="4,3"/>
    <path d="M 590 100 Q 600 70, 585 40" stroke-dasharray="4,3"/>
    <path d="M 475 140 Q 465 110, 480 80" stroke-dasharray="4,3"/>
    <path d="M 670 120 Q 685 90, 665 60" stroke-dasharray="4,3"/>
  </g>

  <!-- Sci-Fi HUD Overlay & Telemetry Elements -->
  <!-- Target Reticle on Urban Hotspot -->
  <g transform="translate(572, 280)">
    <circle cx="0" cy="0" r="48" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6,4" opacity="0.8"/>
    <circle cx="0" cy="0" r="24" fill="none" stroke="#ff2e00" stroke-width="2"/>
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#glow)"/>
    <line x1="-60" y1="0" x2="60" y2="0" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
    <line x1="0" y1="-60" x2="0" y2="60" stroke="#ef4444" stroke-width="1" stroke-opacity="0.6"/>
  </g>

  <!-- Hotspot Data Callout Badge -->
  <g transform="translate(640, 220)">
    <rect x="0" y="0" width="220" height="72" rx="10" fill="#090d16" fill-opacity="0.9" stroke="#ef4444" stroke-width="1.5" filter="url(#glow)"/>
    <text x="14" y="24" fill="#f87171" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CORE HEAT ENTRAPMENT</text>
    <text x="14" y="48" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800">44.8°C <tspan fill="#f97316" font-size="12">LST</tspan></text>
    <text x="14" y="63" fill="#94a3b8" font-family="sans-serif" font-size="10">Radiative retention: +8.4°C vs rural</text>
  </g>

  <!-- Cool Buffer Callout Badge -->
  <g transform="translate(100, 310)">
    <rect x="0" y="0" width="190" height="64" rx="10" fill="#090d16" fill-opacity="0.9" stroke="#10b981" stroke-width="1.5" filter="url(#glow)"/>
    <text x="14" y="22" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">COOL CANOPY BUFFER</text>
    <text x="14" y="44" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="20" font-weight="800">29.2°C <tspan fill="#10b981" font-size="11">NDVI 0.68</tspan></text>
    <text x="14" y="57" fill="#94a3b8" font-family="sans-serif" font-size="9.5">Vegetative cooling active</text>
  </g>

  <!-- Top Banner Info -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="340" height="54" rx="8" fill="#090d16" fill-opacity="0.85" stroke="#334155" stroke-width="1"/>
    <circle cx="20" cy="27" r="6" fill="#f97316"/>
    <circle cx="20" cy="27" r="10" fill="none" stroke="#f97316" stroke-width="1.5" opacity="0.6"/>
    <text x="38" y="23" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">AI THERMAL SATELLITE RADAR</text>
    <text x="38" y="41" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">MODIS / Landsat 9 TIRS Spectral Radiance</text>
  </g>

  <!-- Bottom Thermal Temperature Scale Bar -->
  <g transform="translate(400, 610)">
    <rect x="0" y="0" width="400" height="12" rx="6" fill="url(#thermalBarGrad)"/>
    <text x="0" y="32" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">24°C (Cool Rural)</text>
    <text x="180" y="32" fill="#fbbf24" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600">34°C (Suburban)</text>
    <text x="320" y="32" fill="#ef4444" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">46°C (Extreme UHI)</text>
  </g>
</svg>
