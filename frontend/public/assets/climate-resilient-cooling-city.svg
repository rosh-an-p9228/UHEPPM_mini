<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="coolBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051319"/>
      <stop offset="40%" stop-color="#081f26"/>
      <stop offset="100%" stop-color="#062e24"/>
    </linearGradient>

    <!-- Cooling Aura -->
    <radialGradient id="coolingAura" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.5"/>
      <stop offset="40%" stop-color="#10b981" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0"/>
    </radialGradient>

    <!-- Cool Roof Gradient (White high-albedo) -->
    <linearGradient id="coolRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>

    <!-- Green Roof Gradient -->
    <linearGradient id="greenRoofGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>

    <!-- Eco Modern Building Gradient -->
    <linearGradient id="ecoBldg1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0f2b34"/>
      <stop offset="100%" stop-color="#081820"/>
    </linearGradient>

    <!-- Wetland Water Gradient -->
    <linearGradient id="waterGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="ecoGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#10b981" stroke-width="0.75" stroke-opacity="0.1"/>
    </pattern>

    <filter id="ecoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="mistGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="675" fill="url(#coolBgGrad)"/>
  <rect width="1200" height="675" fill="url(#ecoGrid)"/>

  <!-- Cooling Ambient Glow -->
  <circle cx="600" cy="350" r="450" fill="url(#coolingAura)" filter="url(#mistGlow)"/>

  <!-- Urban Wetland / Water Misting Lagoon -->
  <ellipse cx="600" cy="540" rx="480" ry="90" fill="url(#waterGrad)" filter="url(#ecoGlow)"/>
  <ellipse cx="600" cy="540" rx="360" ry="60" fill="#06b6d4" fill-opacity="0.3" filter="url(#mistGlow)"/>

  <!-- City Skyline with Green Roofs & Cool White Albedo Surfaces -->
  <g id="ecoCity">
    <!-- Building 1 Left (Eco High Rise) -->
    <rect x="180" y="240" width="80" height="270" rx="6" fill="url(#ecoBldg1)" stroke="#06b6d4" stroke-width="1.2"/>
    <!-- Green Roof -->
    <rect x="175" y="230" width="90" height="14" rx="4" fill="url(#greenRoofGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#ecoGlow)"/>
    <circle cx="195" cy="225" r="5" fill="#34d399"/><circle cx="220" cy="223" r="7" fill="#10b981"/><circle cx="245" cy="225" r="5" fill="#34d399"/>

    <!-- Building 2 Left (Cool White Roof) -->
    <rect x="290" y="190" width="95" height="320" rx="6" fill="url(#ecoBldg1)" stroke="#38bdf8" stroke-width="1.2"/>
    <rect x="285" y="180" width="105" height="14" rx="3" fill="url(#coolRoofGrad)" stroke="#ffffff" stroke-width="2" filter="url(#ecoGlow)"/>
    <text x="300" y="174" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="700">SRI 104 COOL ROOF</text>

    <!-- Central Sustainable Tower -->
    <rect x="420" y="110" width="120" height="400" rx="8" fill="url(#ecoBldg1)" stroke="#10b981" stroke-width="1.5"/>
    <!-- Vertical Living Green Wall Strips -->
    <rect x="440" y="140" width="16" height="320" rx="4" fill="url(#greenRoofGrad)" opacity="0.85"/>
    <rect x="504" y="140" width="16" height="320" rx="4" fill="url(#greenRoofGrad)" opacity="0.85"/>
    <!-- Sky Garden on Tower -->
    <rect x="410" y="98" width="140" height="16" rx="5" fill="url(#greenRoofGrad)" stroke="#34d399" stroke-width="2" filter="url(#ecoGlow)"/>
    <!-- Solar Canopy Spire -->
    <polygon points="480,40 450,98 510,98" fill="#06b6d4" opacity="0.9"/>
    <line x1="480" y1="40" x2="480" y2="15" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="480" cy="12" r="5" fill="#38bdf8" filter="url(#ecoGlow)"/>

    <!-- Building 4 Right (Solar Pedestrian Corridor) -->
    <rect x="575" y="160" width="110" height="350" rx="6" fill="url(#ecoBldg1)" stroke="#06b6d4" stroke-width="1.2"/>
    <rect x="570" y="150" width="120" height="14" rx="4" fill="url(#coolRoofGrad)" stroke="#ffffff" stroke-width="2" filter="url(#ecoGlow)"/>
    <rect x="590" y="200" width="80" height="8" rx="2" fill="#38bdf8" opacity="0.8"/>
    <rect x="590" y="240" width="80" height="8" rx="2" fill="#38bdf8" opacity="0.8"/>

    <!-- Building 5 Right (Green Terrace Architecture) -->
    <rect x="715" y="210" width="100" height="300" rx="6" fill="url(#ecoBldg1)" stroke="#10b981" stroke-width="1.2"/>
    <rect x="710" y="200" width="110" height="14" rx="4" fill="url(#greenRoofGrad)" stroke="#10b981" stroke-width="1.5" filter="url(#ecoGlow)"/>
    <rect x="730" y="250" width="80" height="12" rx="3" fill="url(#greenRoofGrad)" opacity="0.9"/>

    <!-- Building 6 Outer Right -->
    <rect x="845" y="270" width="80" height="240" rx="6" fill="url(#ecoBldg1)" stroke="#06b6d4" stroke-width="1"/>
    <rect x="840" y="260" width="90" height="14" rx="4" fill="url(#coolRoofGrad)" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- Dense Urban Tree Canopy Boulevards -->
  <g id="urbanCanopy" fill="#10b981" stroke="#059669" stroke-width="1.5" filter="url(#ecoGlow)">
    <circle cx="120" cy="480" r="28"/><circle cx="150" cy="495" r="22"/>
    <circle cx="270" cy="505" r="25"/><circle cx="300" cy="515" r="20"/>
    <circle cx="400" cy="510" r="30"/><circle cx="560" cy="515" r="28"/>
    <circle cx="700" cy="505" r="26"/><circle cx="835" cy="515" r="32"/>
    <circle cx="950" cy="495" r="30"/><circle cx="1020" cy="480" r="28"/>
  </g>

  <!-- Cool Air Microclimate Flows & Misting -->
  <g stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.85">
    <path d="M 200 440 Q 350 410, 500 440 T 800 430" stroke-dasharray="8,6"/>
    <path d="M 400 460 Q 600 430, 850 470" stroke-dasharray="6,4"/>
  </g>

  <!-- AI Mitigation Metric Callout 1 (Cooling Relief) -->
  <g transform="translate(130, 100)">
    <rect x="0" y="0" width="220" height="74" rx="12" fill="#061820" fill-opacity="0.95" stroke="#10b981" stroke-width="1.8" filter="url(#ecoGlow)"/>
    <text x="16" y="24" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">SIMULATED COOLING</text>
    <text x="16" y="50" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="24" font-weight="800">-4.8°C <tspan fill="#38bdf8" font-size="13">RELIEF</tspan></text>
    <text x="16" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10">Cool roof + 40% Canopy expansion</text>
  </g>

  <!-- AI Mitigation Metric Callout 2 (Carbon Offset) -->
  <g transform="translate(850, 130)">
    <rect x="0" y="0" width="230" height="74" rx="12" fill="#061820" fill-opacity="0.95" stroke="#06b6d4" stroke-width="1.8" filter="url(#ecoGlow)"/>
    <text x="16" y="24" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="700">CARBON SEQUESTRATION</text>
    <text x="16" y="50" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800">1,420 <tspan fill="#34d399" font-size="13">tCO₂/yr</tspan></text>
    <text x="16" y="66" fill="#94a3b8" font-family="sans-serif" font-size="10">Urban forest & green infrastructure</text>
  </g>

  <!-- Top Title Banner -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="360" height="54" rx="8" fill="#061820" fill-opacity="0.9" stroke="#0f3e46" stroke-width="1"/>
    <circle cx="20" cy="27" r="6" fill="#10b981"/>
    <circle cx="20" cy="27" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6"/>
    <text x="38" y="23" fill="#f1f5f9" font-family="'Outfit', sans-serif" font-size="13" font-weight="700">AI URBAN PLANNING SIMULATOR</text>
    <text x="38" y="41" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="10">Physics-Informed Climate Mitigation Modeling</text>
  </g>
</svg>
